<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A persistent local chat interface for LFM2.5-2.6B.">
  <title>Local LFM Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0e11;
      --panel: #15171c;
      --panel-2: #1c1f25;
      --line: #292c34;
      --muted: #9298a6;
      --text: #f2f3f5;
      --accent: #b7f36b;
      --user: #252932;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    aside {
      min-height: 100vh;
      padding: 20px 14px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: #111216;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 6px 22px;
    }

    .brand { font-size: 16px; font-weight: 750; letter-spacing: -.02em; }
    .brand span { color: var(--accent); }

    .new-chat {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #3a3e48;
      border-radius: 11px;
      background: var(--panel-2);
      cursor: pointer;
      text-align: left;
    }

    .new-chat:hover { border-color: #555b68; }
    .history-title { margin: 24px 8px 8px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .history-empty { padding: 12px 8px; color: #6e7480; font-size: 12px; }

    .history-item {
      width: 100%;
      margin-bottom: 5px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .history-item:hover { background: var(--panel); }
    .history-item.active { border-color: #3b4234; background: #1b2018; }
    .history-id { display: block; overflow-wrap: anywhere; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .history-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }

    .app {
      height: 100vh;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background:
        radial-gradient(circle at 50% -30%, #27311d 0, transparent 36rem),
        var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 69px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
    }

    .mobile-history { display: none; }
    .session { min-width: 0; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .status::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--accent); }

    #messages {
      overflow-y: auto;
      padding: 38px 24px 28px;
    }

    .welcome { max-width: 520px; margin: 12vh auto 0; text-align: center; }
    .welcome h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 42px); line-height: 1.1; letter-spacing: -.04em; }
    .welcome p { margin: 0; color: var(--muted); }

    .message { max-width: 720px; margin: 0 auto 28px; }
    .label { margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .message.user .bubble { width: fit-content; max-width: 85%; margin-left: auto; padding: 11px 15px; border: 1px solid #353a45; border-radius: 16px 16px 4px 16px; background: var(--user); white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user .label { text-align: right; }

    details.thinking { margin: 0 0 15px; color: var(--muted); }
    details.thinking summary { width: fit-content; padding: 5px 9px; border-radius: 7px; background: var(--panel); cursor: pointer; font-size: 12px; user-select: none; }
    details.thinking pre { max-height: 260px; margin: 8px 0 0; padding: 12px; overflow: auto; border-left: 2px solid #41464f; color: #aeb3bd; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .answer { line-height: 1.7; overflow-wrap: anywhere; }
    .answer > :first-child { margin-top: 0; }
    .answer > :last-child { margin-bottom: 0; }
    .answer p { margin: 0 0 12px; }
    .answer h1, .answer h2, .answer h3 { margin: 20px 0 8px; line-height: 1.25; letter-spacing: -.02em; }
    .answer h1 { font-size: 23px; }
    .answer h2 { font-size: 19px; }
    .answer h3 { font-size: 16px; }
    .answer ul, .answer ol { margin: 8px 0 14px; padding-left: 24px; }
    .answer code { padding: 2px 5px; border-radius: 5px; background: #24272e; color: #d8f5b2; font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; }
    .answer pre { margin: 12px 0; padding: 14px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #101115; }
    .answer pre code { padding: 0; background: transparent; color: #d9dde5; }
    .response-stats { margin-top: 11px; color: #747b87; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .message.assistant.streaming .answer::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 3px; vertical-align: -.15em; background: var(--accent); animation: blink .8s steps(2) infinite; }
    .stream-error { color: #ffaaa4; }

    form { padding: 16px 24px 24px; background: linear-gradient(transparent, var(--bg) 20%); }
    .composer { display: flex; align-items: flex-end; gap: 10px; max-width: 750px; margin: auto; padding: 10px 10px 10px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 18px 45px rgb(0 0 0 / 28%); }
    textarea { flex: 1; min-height: 26px; max-height: 150px; padding: 2px 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); }
    textarea::placeholder { color: #737987; }
    .send { width: 38px; height: 38px; flex: 0 0 auto; border: 0; border-radius: 12px; background: var(--accent); color: #18200f; font-size: 20px; font-weight: 800; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .35; }
    .hint { margin: 9px auto 0; color: var(--muted); font-size: 11px; text-align: center; }
    .backdrop { display: none; }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 760px) {
      .shell { display: block; }
      aside { position: fixed; z-index: 20; inset: 0 auto 0 0; width: min(84vw, 300px); transform: translateX(-102%); transition: transform .2s ease; box-shadow: 18px 0 50px rgb(0 0 0 / 45%); }
      body.sidebar-open aside { transform: translateX(0); }
      .backdrop { position: fixed; z-index: 10; inset: 0; background: rgb(0 0 0 / 55%); }
      body.sidebar-open .backdrop { display: block; }
      .mobile-history { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; }
      header { padding: 14px 16px; }
      #messages { padding: 28px 16px 20px; }
      form { padding: 12px 12px 16px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside id="sidebar" aria-label="Chat history">
      <div class="sidebar-head"><div class="brand">Local <span>LFM</span></div></div>
      <button class="new-chat" id="new-chat" type="button">＋ New chat</button>
      <div class="history-title">History</div>
      <nav id="history-list"></nav>
    </aside>
    <button class="backdrop" id="backdrop" type="button" aria-label="Close chat history"></button>

    <main class="app">
      <header>
        <button class="mobile-history" id="mobile-history" type="button" aria-label="Open chat history">☰</button>
        <div class="session" id="session-name">New chat</div>
        <div class="status">LFM2.5-2.6B</div>
      </header>

      <section id="messages" aria-live="polite"></section>

      <form id="chat-form">
        <div class="composer">
          <textarea id="prompt" rows="1" maxlength="8000" placeholder="Message LFM2…" aria-label="Chat message" required></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message">↑</button>
        </div>
        <div class="hint">Enter to send · Shift + Enter for a new line</div>
      </form>
    </main>
  </div>

  <script>
    const form = document.querySelector("#chat-form");
    const prompt = document.querySelector("#prompt");
    const send = document.querySelector("#send");
    const messages = document.querySelector("#messages");
    const historyList = document.querySelector("#history-list");
    const sessionName = document.querySelector("#session-name");
    const newChatButton = document.querySelector("#new-chat");
    let currentChatId = null;
    let busy = false;

    const escapeHtml = text => text.replace(/[&<>]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character]);

    function inlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    }

    function renderMarkdown(text) {
      const lines = text.replace(/\r\n/g, "\n").split("\n");
      const output = [];
      let code = false;
      let list = null;

      const closeList = () => {
        if (list) output.push(`</${list}>`);
        list = null;
      };

      for (const line of lines) {
        if (line.startsWith("```")) {
          closeList();
          output.push(code ? "</code></pre>" : "<pre><code>");
          code = !code;
          continue;
        }
        if (code) {
          output.push(`${escapeHtml(line)}\n`);
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const unordered = line.match(/^\s*[-*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
        } else if (unordered || ordered) {
          const nextList = unordered ? "ul" : "ol";
          if (list !== nextList) {
            closeList();
            list = nextList;
            output.push(`<${list}>`);
          }
          output.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
        } else if (!line.trim()) {
          closeList();
        } else {
          closeList();
          output.push(`<p>${inlineMarkdown(line)}</p>`);
        }
      }
      closeList();
      if (code) output.push("</code></pre>");
      return output.join("");
    }

    function showWelcome() {
      messages.innerHTML = "";
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.innerHTML = "<h1>What can I help with?</h1><p>Your chats stay on this machine and are answered by the local LFM2 model.</p>";
      messages.append(welcome);
    }

    function addUserMessage(text) {
      document.querySelector(".welcome")?.remove();
      const message = document.createElement("article");
      message.className = "message user";
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "You";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      message.append(label, bubble);
      messages.append(message);
      scrollMessages();
    }

    function setResponseStats(element, stats) {
      if (!stats || stats.total_seconds == null) {
        element.hidden = true;
        return;
      }
      const speed = Number(stats.tokens_per_second || 0).toFixed(2);
      const total = Number(stats.total_seconds || 0).toFixed(2);
      const tokens = Number(stats.generated_tokens || 0);
      element.textContent = `${speed} tok/s · ${total} s total · ${tokens} tokens`;
      element.hidden = false;
    }

    function addAssistantMessage(thinking = "", content = "", streaming = false, stats = null) {
      document.querySelector(".welcome")?.remove();
      const message = document.createElement("article");
      message.className = `message assistant${streaming ? " streaming" : ""}`;
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "LFM2";
      const details = document.createElement("details");
      details.className = "thinking";
      details.hidden = !thinking;
      const summary = document.createElement("summary");
      summary.textContent = "Thinking";
      const thought = document.createElement("pre");
      thought.textContent = thinking;
      details.append(summary, thought);
      const answer = document.createElement("div");
      answer.className = "answer";
      answer.innerHTML = renderMarkdown(content);
      const responseStats = document.createElement("div");
      responseStats.className = "response-stats";
      setResponseStats(responseStats, stats);
      message.append(label, details, answer, responseStats);
      messages.append(message);
      scrollMessages();
      return { message, details, thought, answer, responseStats, answerText: content };
    }

    function scrollMessages() {
      messages.scrollTop = messages.scrollHeight;
    }

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    async function loadHistory() {
      const response = await fetch("/api/chats");
      if (!response.ok) return;
      const chats = await response.json();
      historyList.innerHTML = "";
      if (!chats.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "No saved chats yet.";
        historyList.append(empty);
        return;
      }

      for (const chat of chats) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `history-item${chat.id === currentChatId ? " active" : ""}`;
        button.title = chat.id;
        const id = document.createElement("span");
        id.className = "history-id";
        id.textContent = chat.id;
        const meta = document.createElement("span");
        meta.className = "history-meta";
        meta.textContent = `${chat.message_count} messages · ${formatDate(chat.updated_at)}`;
        button.append(id, meta);
        button.addEventListener("click", () => loadChat(chat.id));
        historyList.append(button);
      }
    }

    async function createChat() {
      const response = await fetch("/api/chats", { method: "POST" });
      if (!response.ok) throw new Error("Could not create a chat.");
      const chat = await response.json();
      currentChatId = chat.id;
      sessionName.textContent = currentChatId;
      await loadHistory();
      return currentChatId;
    }

    async function loadChat(chatId) {
      if (busy) return;
      const response = await fetch(`/api/chats/${chatId}`);
      if (!response.ok) return;
      const chat = await response.json();
      currentChatId = chat.id;
      sessionName.textContent = currentChatId;
      messages.innerHTML = "";
      for (const message of chat.messages) {
        if (message.role === "user") addUserMessage(message.content);
        if (message.role === "assistant") {
          addAssistantMessage(message.thinking || "", message.content || "", false, message.stats);
        }
      }
      if (!chat.messages.length) showWelcome();
      document.body.classList.remove("sidebar-open");
      await loadHistory();
    }

    async function sendMessage(message) {
      busy = true;
      send.disabled = true;
      prompt.disabled = true;
      let reply = null;

      try {
        if (!currentChatId) await createChat();
        addUserMessage(message);
        reply = addAssistantMessage("", "", true);
        const response = await fetch(`/api/chats/${currentChatId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        if (!response.ok || !response.body) throw new Error("The model could not answer.");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const lines = buffer.split("\n");
          buffer = done ? "" : lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.type === "thinking") {
              reply.details.hidden = false;
              reply.thought.textContent += event.delta;
            } else if (event.type === "thinking_replace") {
              reply.details.hidden = !event.text;
              reply.thought.textContent = event.text;
            } else if (event.type === "answer") {
              reply.answerText += event.delta;
              reply.answer.innerHTML = renderMarkdown(reply.answerText);
              scrollMessages();
              await new Promise(resolve => setTimeout(resolve, 5));
            } else if (event.type === "answer_replace") {
              reply.answerText = event.text;
              reply.answer.innerHTML = renderMarkdown(reply.answerText);
            } else if (event.type === "stats") {
              setResponseStats(reply.responseStats, event);
            } else if (event.type === "error") {
              reply.answer.classList.add("stream-error");
              reply.answer.textContent = event.message;
            }
          }
          if (done) break;
        }
        reply.message.classList.remove("streaming");
      } catch (error) {
        if (reply) {
          reply.message.classList.remove("streaming");
          const answer = reply.answer;
          answer.classList.add("stream-error");
          answer.textContent = `Sorry, ${error.message.toLowerCase()}`;
        }
      } finally {
        busy = false;
        send.disabled = false;
        prompt.disabled = false;
        prompt.focus();
        await loadHistory();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const message = prompt.value.trim();
      if (!message || busy) return;
      prompt.value = "";
      prompt.style.height = "auto";
      sendMessage(message);
    });

    prompt.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    prompt.addEventListener("input", () => {
      prompt.style.height = "auto";
      prompt.style.height = `${Math.min(prompt.scrollHeight, 150)}px`;
    });

    newChatButton.addEventListener("click", async () => {
      if (busy) return;
      await createChat();
      showWelcome();
      document.body.classList.remove("sidebar-open");
      prompt.focus();
    });
    document.querySelector("#mobile-history").addEventListener("click", () => document.body.classList.add("sidebar-open"));
    document.querySelector("#backdrop").addEventListener("click", () => document.body.classList.remove("sidebar-open"));

    showWelcome();
    loadHistory();
  </script>
</body>
</html>
